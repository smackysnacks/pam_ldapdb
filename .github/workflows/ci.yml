name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; every commit on master gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Action commits are pinned in .github/workflows/actions.lock, generated by
  # `gh actions-lock`. Re-run it after changing any `uses:` line; this job
  # fails if the lockfile is stale or a locked ref has moved.
  lockfile:
    name: verify actions.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: github/gh-actions-lock@verify/v0.5.1

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format-18 --dry-run -Werror

  build:
    # glibc pulls many libc headers in transitively that musl does not, so a
    # build that only ever runs on glibc hides missing libc #includes (see #15).
    # Missing C++ standard library headers (<string>, <stdexcept>, ...) are
    # usually still masked by libstdc++ on both legs.
    name: build (${{ matrix.libc }}, ${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
        compiler: [gcc, clang]
        include:
          - libc: glibc
            container: ''
          - libc: musl
            container: alpine:3.24
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: -O2 -Werror
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (glibc)
        if: matrix.libc == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make g++ clang libldap-dev libpam0g-dev

      - name: Install dependencies (musl)
        if: matrix.libc == 'musl'
        run: apk add --no-cache make g++ clang openldap-dev linux-pam-dev

      - name: Show toolchain
        run: $CXX --version

      - name: Build
        run: make

      - name: Install into staging directory
        run: |
          make install DESTDIR="$PWD/stage" PAMDIR=/lib/security
          test -f stage/lib/security/pam_ldapdb.so
